name: Laravel foundation checks
on:
  pull_request:
  push:
    branches: [main, 'design/v2-experience']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, xml, fileinfo
          tools: composer:v2
          coverage: none
      - run: composer validate --no-check-lock
      - run: composer install --prefer-dist --no-interaction
      - run: find app bootstrap config database routes tests public -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpunit
