name: Public preview acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-acceptance.yml','scripts/public-acceptance.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check preview/site.js && node --check preview/motion.js && node --check preview/seasons.js
      - run: node scripts/public-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdleaf-public-acceptance
          path: visual-evidence/
