name: V6 compact UX and photographic references
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v6-media.yml','scripts/v6-media.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: preview
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/v6-media.py
      - name: Commit sourced photographs and compact profiles
        working-directory: preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Import attributed photographic references and compact product pages"
          git push origin HEAD:gh-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-photographic-review
          path: visual-evidence/
