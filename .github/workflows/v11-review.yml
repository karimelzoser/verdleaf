name: V11 SEO and regression acceptance
on:
  push:
    branches: [main]
    paths: ['scripts/seo-validate.py','scripts/v11-review.mjs','.github/workflows/v11-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: preview
      - run: pip install beautifulsoup4
      - run: python scripts/seo-validate.py preview
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check preview/site.js && node --check preview/admin-demo.js && node scripts/v11-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdleaf-v11-review-evidence
          path: visual-evidence/
