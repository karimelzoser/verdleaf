name: Publish Verdleaf preview to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: verdleaf-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: false
      - name: Validate static preview
        run: |
          node --check site.js
          node --check catalogue.js
          node -e "global.window={}; require('./catalogue.js'); if(window.VERDLEAF_CATALOGUE.length!==29) process.exit(1)"
          test -f index.html
          test -f .nojekyll
          mkdir -p /tmp/verdleaf-pages
          cp index.html site.css site.js catalogue.js robots.txt .nojekyll /tmp/verdleaf-pages/
          cp -r assets /tmp/verdleaf-pages/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/verdleaf-pages
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
