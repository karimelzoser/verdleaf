name: V9 full website and administration review
on:
  push:
    branches: [main]
    paths: ['scripts/v9-review.mjs','.github/workflows/v9-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check preview/site.js && node --check preview/living.js && node --check preview/motion.js && node scripts/v9-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdleaf-v9-review-evidence
          path: visual-evidence/
