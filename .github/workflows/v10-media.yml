name: V10 complete ingredient photography
on:
  push:
    branches: [main]
    paths: ['scripts/v10-media.py','.github/workflows/v10-media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: preview
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/v10-media.py
      - working-directory: preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Complete remaining licensed ingredient reference imagery"
          git push origin HEAD:gh-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-media-review
          path: visual-evidence/
