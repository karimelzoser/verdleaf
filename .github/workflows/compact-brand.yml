name: V7 compact horizontal brand header
on:
  push:
    branches: [main]
    paths: ['scripts/compact-brand.py','scripts/check-header.mjs','.github/workflows/compact-brand.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  brand:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: preview
      - run: pip install pillow
      - run: python scripts/compact-brand.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-header.mjs
      - name: Publish compact header
        working-directory: preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Horizontal transparent brand lockup and compact icon navigation"
          git push origin HEAD:gh-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: header-visual-evidence
          path: visual-evidence/
