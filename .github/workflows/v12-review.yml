name: V12 operational and SEO acceptance
on:
  push:
    branches: [main]
    paths: ['scripts/seo-validate.py','scripts/v12-review.mjs','.github/workflows/v12-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: preview
      - run: pip install beautifulsoup4
      - run: python scripts/seo-validate.py preview
      - name: Validate separate sitemap candidate (not deployed)
        run: |
          python scripts/seo-validate.py preview --production-output /tmp/verdleaf-release-candidate --approved-domain https://verdleaf.com/ --approve-indexing
          python -c "import xml.etree.ElementTree as E; r=E.parse('/tmp/verdleaf-release-candidate/sitemap.xml'); assert len(r.getroot())==120; print('PASS 120 candidate production sitemap URLs')"
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check preview/site.js && node --check preview/admin-demo.js && node scripts/v12-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdleaf-v12-review-evidence
          path: visual-evidence/
