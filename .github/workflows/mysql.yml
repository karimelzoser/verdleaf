name: MySQL compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-root-password
          MYSQL_DATABASE: verdleaf_test
          MYSQL_USER: verdleaf
          MYSQL_PASSWORD: test-only-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: verdleaf_test
      DB_USERNAME: verdleaf
      DB_PASSWORD: test-only-db-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, dom, curl, xml, fileinfo
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: vendor/bin/phpunit
